# ==========================================
# Refix Batch Configuration File
# ==========================================
#
# Used in batch mode (batch: "true").
# Place this file as `.refix-batch.yaml` in your repository root,
# or set YAML content as the `REFIX_CONFIG_BATCH_YAML` GitHub Actions Variable.
# For single-PR (action) mode, use .refix.yaml instead.
#
# Structure:
#   global:    - Settings that apply to all repositories
#   repositories: - List of target repositories (required)
#
# Merge priority: repository settings > global settings > defaults
#
# Refix v2.0.0 runs a Claude self-review on each PR's diff (base..head) and
# applies the resulting findings in a separate fix session. There is no
# external review provider; everything is driven by Claude.

global:
  # Git committer identity (Optional)
  user_name: "your-name"
  user_email: "your-email@example.com"

  # Model settings (Optional)
  # Models used by the two Claude sessions per run.
  #   review: generates the self-review XML (default: "opus")
  #   fix   : applies the findings as commits (default: "sonnet")
  models:
    review: "opus"
    fix: "sonnet"

  # Minimum severity to act on for self-review findings (Optional)
  # Findings below this severity are dropped before the fix phase runs.
  # Allowed values (descending importance): critical, major, minor, nitpick
  # Default: "nitpick" (apply every finding regardless of severity).
  # Raise this to "minor" or "major" to suppress lower-priority noise and avoid
  # loops where the reviewer keeps flagging subjective changes.
  # review_min_severity: "nitpick"

  # Whether to write Claude's stdout to the PR state comment (Optional)
  # Default: true
  write_result_to_comment: true

  # Automatically merge PR when it reaches refix: done state (Optional)
  # Default: false
  auto_merge: false

  # PR merge strategy (Optional)
  # "auto": Automatically choose an allowed strategy from repo settings (merge > squash > rebase)
  # "merge" / "squash" / "rebase": Use only the specified strategy
  # Default: "auto"
  merge_method: "auto"

  # Base-branch update strategy (Optional)
  # "merge": Update by merging the base branch (default, creates a merge commit)
  # "rebase": Rebase onto the base branch (linear history, requires force-push)
  # Default: "merge"
  base_update_method: "merge"

  # Enable only selected Refix PR labels (Optional)
  # Allowed: running, done, merged, auto_merge_requested
  # Default: all labels enabled
  enabled_pr_labels:
    - running
    - done
    - merged
    - auto_merge_requested

  # Whether to add GitHub PR labels for visual status display (Optional)
  # When false, only state comment markers are used; labels are not created or modified.
  # Default: true
  use_pr_labels: true

  # Store state in local files instead of PR comments (Optional)
  # When true, state is saved to state/{org}/{repo}/{pr-number}.md
  # Default: false
  use_local_state: false

  # Whether to process DRAFT PRs (Optional)
  # Default: false
  process_draft_prs: false

  # Whether to include fork repositories when expanding owner/* targets (Optional)
  # Default: true
  include_fork_repositories: true

  # Language for prompts and UI messages (Optional)
  # "en": English (default)
  # "ja": Japanese
  language: "en"

  # State comment timestamp timezone (Optional)
  # Default: UTC
  state_comment_timezone: UTC

  # Per-run processing limits (Optional)
  max_modified_prs_per_run: 0
  max_committed_prs_per_run: 2
  max_claude_prs_per_run: 0

  # CI empty-check grace period (Optional)
  ci_empty_as_success: true
  ci_empty_grace_minutes: 5

  # Restrict Refix processing to PRs authored by specific users (Optional, fnmatch wildcards supported)
  # target_authors: ["my-user", "dep*"]

  # Restrict auto-merge to PRs authored by specific users (Optional, fnmatch wildcards supported)
  # auto_merge_authors: ["dep*"]

  # Exclude PRs by author login pattern (Optional, fnmatch wildcards supported)
  # Note: To match a literal "[" (e.g. GitHub bot logins like "dependabot[bot]"),
  #       use "[[]" in the pattern: "*[[]bot]" matches any login ending with "[bot]"
  # exclude_authors: ["*[[]bot]", "renovate-bot", "some-user"]

  # Exclude PRs by label name pattern (Optional, fnmatch wildcards supported)
  # exclude_labels: ["autorelease: *", "do-not-merge"]

  # Python version for setup commands (Optional)
  # When specified, installs the given Python version via uv and prepends it to PATH
  # before running setup commands. Can be overridden per repository.
  # Use "X.Y" format (e.g. "3.11", "3.10").
  # Refix itself always runs on Python 3.12 regardless of this setting.
  # python_version: "3.12"

  # Node.js version for setup commands (Optional)
  # When specified, installs the given Node.js major version via fnm and prepends it to PATH
  # before running setup commands. Can be overridden per repository.
  # Use a major version number (e.g. "22", "24").
  # node_version: "22"

  # Global setup commands run before each repository's own setup (Optional)
  # Both global setup and per-repo setup are executed (global first, then repo).
  # setup:
  #   when: always  # "always" or "clone_only"
  #   commands:
  #     - run: npm install -g some-tool
  #       name: Install global tool

# Target repository settings (Required)
# List the target repositories.
# Per-repository settings override global settings (dict values are deep-merged at sub-key level).
repositories:
  - repo: "owner/repo1"

  - repo: "owner/repo2"
    # Per-repo overrides (Optional)
    models:
      fix: "opus"  # Override global fix model for this repo
    auto_merge: false  # Disable auto-merge for this repo

  - repo: "owner/repo3"
    # Python version override for this repository (Optional)
    # python_version: "3.11"

    # Node.js version override for this repository (Optional)
    # node_version: "22"

    # Per-repo setup commands (Optional)
    # These run after global setup. If specified, they override the target repository's .refix.yaml setup.
    setup:
      when: always
      commands:
        - run: npm install
          name: Install Node.js dependencies

  # Wildcard expansion: expands to all repos under the owner
  # - repo: "owner/*"
